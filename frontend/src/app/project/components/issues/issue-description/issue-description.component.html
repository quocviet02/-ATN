@if (isEditing) {
  <quill-editor class="content-editor"
    [modules]="editorOptions"
    [formControl]="descriptionControl"
    [placeholder]="''"
    (onEditorCreated)="editorCreated($event)">
  </quill-editor>
    <div class="pt-3 flex
      items-center">
    <j-button [isWorking]="isWorking"
      [className]="'btn-primary'"
      class="mr-2"
      (click)="save()">
    Save</j-button>
    <j-button (click)="cancel()"
      [className]="'btn-empty'">
      Cancel
    </j-button>
  </div>
} @else {
  @if (!isEditing) {
    <div class="ql-snow content-readonly"
      [class.readonly-disabled]="!canEdit"
      (click)="canEdit && setEditMode(true)">
      <div class="ql-editor"
      [innerHTML]="issue.description || (canEdit ? 'Click to add description' : 'Không có mô tả')"></div>
      <div class="icon-edit" *ngIf="canEdit">
        <i nz-icon
          class="cursor-pointer"
          title="Click to edit"
          nzType="edit"
        nzTheme="outline"></i>
      </div>
    </div>
  }
}
