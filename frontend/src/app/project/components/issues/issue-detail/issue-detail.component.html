@if (issue) {
  <div class="w-full h-full" [class.pl-4]="isShowCloseButton">
    <div class="flex items-center pt-4 text-textDarkest">
      <issue-type [issue]="issue"></issue-type>
      <div class="flex-auto"></div>
      <j-button
        *ngIf="canDelete"
        icon="trash"
        [className]="'btn-empty'"
        (click)="openDeleteIssueModal()">
      </j-button>
      @if (isShowCloseButton) {
        <j-button icon="expand" (click)="openIssuePage()" [iconSize]="24" [className]="'btn-empty'"></j-button>
      }
      @if (isShowCloseButton) {
        <j-button icon="times" [iconSize]="24" (click)="closeModal()" [className]="'btn-empty'"></j-button>
      }
    </div>
    <div class="flex w-full flex-wrap pb-16">
      <div class="sm:w-full md:w-7/12 lg:w-4/6 pr-10">
        <issue-title [issue]="issue" [canEdit]="(canEditTask$ | async) ?? false"></issue-title>
        <div class="pt-4 pb-2 text-15 font-medium">Description</div>
        <issue-description [issue]="issue" [canEdit]="(canEditTask$ | async) ?? false"></issue-description>
        <issue-feed [issue]="issue"></issue-feed>
      </div>
      <div class="sm:w-full md:w-5/12 lg:w-2/6 pt-1">
        <issue-status [issue]="issue" [canEdit]="(canEditTask$ | async) ?? false"></issue-status>
        <issue-reporter [issue]="issue" [users]="projectQuery.users$ | async"></issue-reporter>
        <issue-assignees
          [issue]="issue"
          [users]="projectQuery.users$ | async"
          [canAssignSelf]="(canAssignSelf$ | async) ?? false"
          [canAssignOthers]="(canAssignOthers$ | async) ?? false">
        </issue-assignees>
        <issue-priority [issue]="issue" [canEdit]="(canEditTask$ | async) ?? false"></issue-priority>
        <issue-due-date [issue]="issue" [canEdit]="(canEditTask$ | async) ?? false"></issue-due-date>
        <div class="mt-3 pt-3 leading-loose border-t border-borderLightest text-textMedium text-13">
          <div>Created - {{ issue.createdAt | date:"medium" }}</div>
          <div>Updated - {{ issue.updatedAt | date:"medium" }}</div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <issue-loader></issue-loader>
}
